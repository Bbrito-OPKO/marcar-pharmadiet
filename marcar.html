<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marcar visita — Pharmadiet Veterinary</title>
<meta property="og:title" content="Marcar visita — Pharmadiet Veterinary">
<meta property="og:description" content="Escolha o dia e a hora que lhe der mais jeito para a visita da Pharmadiet.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#175FAA">
<style>
  :root{--navy:#175FAA;--navy-d:#134F8E;--green:#87BA25;--green-d:#6f9a1e;--ink:#2B3441;--muted:#6C7889;--line:#E2E8F0;--bg:#F4F7FB}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}
  .wrap{max-width:900px;margin:0 auto;padding:24px 16px 48px}
  .brand{display:flex;justify-content:center;margin-bottom:18px}
  .brand img{height:46px;max-width:72vw;object-fit:contain}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 28px rgba(20,40,70,.06);padding:24px 22px}
  h1{font-size:20px;margin:0 0 18px;grid-column:1;white-space:nowrap}
  .panes{display:grid;grid-template-columns:1fr max-content;grid-template-rows:auto 1fr;gap:0 22px;min-height:360px}
  .pane-cal{grid-column:1;grid-row:2;display:flex;flex-direction:column}
  .pane-times{grid-column:2;grid-row:1/3;border-left:1px solid var(--line);padding:0 18px;display:flex;flex-direction:column}
  .cal-h{font-weight:800;color:var(--navy);font-size:17px;text-transform:capitalize;margin-bottom:12px}
  .dow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:8px}
  .dow span{text-align:center;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;flex:1;grid-auto-rows:minmax(96px,1fr)}
  .cell{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:17px;border-radius:14px;color:#C5CED9}
  .cell small{font-size:10px;line-height:1;margin-top:2px;opacity:.8}
  .cell.avail{background:#EAF2FB;color:var(--navy);font-weight:800;cursor:pointer;border:1.5px solid transparent;transition:.15s}
  .cell.avail:hover{border-color:#9CC0E8}
  .cell.avail.dot::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--green);margin-top:3px}
  .cell.alt{background:#fff;color:var(--navy);font-weight:800;cursor:pointer;border:1.5px dashed var(--line);transition:.15s}
  .cell.alt:hover{border-color:#9CC0E8}
  .cell.sel{background:var(--navy);color:#fff}
  .cell.sel.dot::after{background:#fff}
  .cell.alt.sel{background:var(--navy);color:#fff;border-style:solid}
  .cell.today{box-shadow:inset 0 0 0 1.5px #B9D3EE;border-radius:14px}
  .times-h{font-weight:800;color:var(--navy);font-size:16px;text-transform:capitalize;margin-bottom:12px;text-align:center;white-space:nowrap}
  .hint{color:var(--muted);font-size:14px;line-height:1.5;margin-top:36px;text-align:center;max-width:170px}
  .slots{display:flex;flex-direction:column;gap:6px}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 6px;font-size:14px;font-weight:800;color:var(--navy);cursor:pointer;transition:.15s;text-align:center}
  .chip:hover{border-color:#9CC0E8;background:#F3F8FF}
  .chip.sel{border-color:var(--navy);background:var(--navy);color:#fff}
  .chip.pend{border-style:dashed}
  .chip.pend.sel{border-style:solid}
  .pend-note{color:var(--muted);font-size:11px;line-height:1.4;margin-top:6px;text-align:center;max-width:170px}
  /* seletores livres (2026-07-27): hora fora da grelha e dia fora dos propostos. TODOS capados a
     170px pela mesma razão do .hint/.pend-note/.confbtn — a coluna das horas é max-content */
  .freelbl{color:var(--muted);font-size:12px;font-weight:700;line-height:1.35;margin-top:12px;text-align:center;max-width:170px}
  .freerow{display:flex;gap:6px;margin-top:6px;max-width:170px}
  .freesel{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:10px;padding:8px 4px;font-size:13.5px;font-weight:800;color:var(--navy);background:#fff;cursor:pointer;font-family:inherit}
  .freesel:focus{outline:none;border-color:#9CC0E8}
  .freeday{display:block;width:100%;max-width:170px;margin-top:6px;border:1.5px solid var(--line);border-radius:10px;padding:8px 6px;font-size:13.5px;font-weight:800;color:var(--navy);background:#fff;cursor:pointer;font-family:inherit}
  /* passo de confirmacao (2026-07-27): o chip so SELECIONA, e este botao e que envia */
  /* max-width 170px pela MESMA razão do .hint/.pend-note: a coluna das horas é max-content e o
     texto do botão, sem cap, esticava o card inteiro (medido: 484px de scroll a 320px de ecrã) */
  .confbtn{display:block;width:100%;max-width:170px;margin-top:10px;border:none;border-radius:12px;padding:11px 10px;font-size:13.5px;font-weight:800;color:#fff;background:var(--green);cursor:pointer;line-height:1.35;transition:.15s;animation:confin .18s ease-out}
  .confbtn:hover{background:var(--green-d)}
  .confbtn.pend{background:var(--navy)}
  .confbtn.pend:hover{background:var(--navy-d)}
  .confbtn[disabled]{opacity:.6;cursor:default}
  .confbtn:active,.chip:active,.cell.avail:active,.cell.alt:active{transform:scale(.98)}
  .busy::after{content:"";animation:dots 1.2s steps(1,end) infinite}
  @keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
  @keyframes confin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .senderr{color:#C0392B;font-size:12px;line-height:1.45;margin-top:10px;text-align:center;max-width:170px}
  .altbtn,.morebtn{background:#fff;border:1.5px dashed var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;transition:.15s}
  .altbtn{margin-top:10px}
  .morebtn{margin-top:6px;padding:7px 6px;font-size:12px}
  .altbtn:hover,.morebtn:hover{color:var(--navy);border-color:#9CC0E8}
  .sent{background:var(--green);color:#fff;border:2px solid var(--green-d);border-radius:14px;padding:14px 16px;font-size:15px;font-weight:800;line-height:1.45;margin:6px 0 12px;text-align:center}
  .warn{font-size:14px;color:var(--ink);margin:6px 0 12px;line-height:1.5}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:800;cursor:pointer;margin-bottom:10px;text-decoration:none;color:#fff}
  .btn.cal{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
  .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}
  .err{color:#C0392B;font-size:14px}
  @media(max-width:759.98px){
    .panes{gap:0 12px;min-height:300px}
    h1{font-size:13px;margin-bottom:14px}   /* 14px foi testado e TRANSBORDA a 320px (o h1 é nowrap e puxa a coluna do calendário) */
    .pane-times{padding:0 12px}
    .cell{font-size:14px;border-radius:10px}
    .cell.today{border-radius:10px}
    .cell small{font-size:9px}
    .dow span{font-size:10px}
    .grid,.dow{gap:5px}
    .grid{grid-auto-rows:minmax(64px,1fr)}
    .chip{padding:7px 5px;font-size:12.5px;min-height:40px;display:flex;align-items:center;justify-content:center}
    .confbtn{min-height:40px;font-size:12.5px;padding:9px 8px;margin-top:8px;max-width:140px}
    .senderr{font-size:11px;max-width:140px}
    .altbtn{font-size:11px;padding:6px 8px}
    .morebtn{font-size:10.5px;padding:6px 5px}
    .pend-note{font-size:9.5px;max-width:140px}
    .freelbl{font-size:10.5px;max-width:140px;margin-top:10px}
    .freerow{max-width:140px;gap:4px}
    .freesel,.freeday{font-size:12px;padding:7px 3px}
    .freeday{max-width:140px}
    .times-h{font-size:12.5px;white-space:normal}
    .times-h .th-wd{white-space:nowrap}
    .hint{max-width:140px}
    .times-h .th-sep{display:none}
    .times-h .th-dm{display:block}
    .hint{margin-top:16px;font-size:13px}
    .cal-h{font-size:15px}
  }
</style>
</head>

<script>
var DEFAULT_R='https://script.google.com/macros/s/AKfycbzedS0F01jmcMy-mLf4deECfyUr5feSak9e1M5NHlccfUU4dC1dpwNxmg722aRKjBej7g/exec';
var DUR_MIN=30;   // duração da reunião mostrada ao cliente e usada no "Adicionar ao calendário"
var SID='';       // id do pedido: gerado UMA vez por render (o relé dedupa por id → retry não duplica)
var WD=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
var DOW=['Seg','Ter','Qua','Qui','Sex'];
var MES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
var MESc=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function dec(q){if(!q)return null;try{return JSON.parse(decodeURIComponent(escape(atob(q))));}catch(e){try{return JSON.parse(decodeURIComponent(q));}catch(_){return null;}}}
function parseD(iso){var d=iso.slice(0,10).split('-');return new Date(+d[0],+d[1]-1,+d[2]);}
function isoOf(dt){return dt.getFullYear()+'-'+('0'+(dt.getMonth()+1)).slice(-2)+'-'+('0'+dt.getDate()).slice(-2);}
function m2h(m){var H=Math.floor(m/60),M=m%60;return (H<10?'0':'')+H+':'+(M<10?'0':'')+M;}
function fmt(iso){var p=iso.split('T');var dt=parseD(p[0]);return {wd:WD[dt.getDay()],dm:p[0].split('-')[2]+'/'+p[0].split('-')[1],hr:(p[1]||'10:00').replace(':00','h').replace(':','h'),date:p[0],time:(p[1]||'10:00')};}
// .ics unico (2026-07-27, decisao do Bruno): substitui o link do Google Calendar — importa em
// iPhone/Outlook/Google. Horas FLUTUANTES (sem Z/timezone): o evento fica na hora local de quem
// abre, que e a hora da visita. Blob primario (melhor no Safari do iPhone), data URI em fallback
// por feature-test (e tambem o caminho dos sandboxes dos testes, sem Blob/URL).
function icsEsc(s){return String(s).replace(/([\\;,])/g,'\\$1').replace(/\n/g,'\\n');}
function icsHref(c,isoT){var p=isoT.split('T');var d=p[0].replace(/-/g,'');var t=(p[1]||'10:00');
  var ini=(+t.split(':')[0])*60+(+t.split(':')[1]);var fim=ini+DUR_MIN;
  var s=d+'T'+t.replace(':','')+'00';var e=d+'T'+m2h(fim).replace(':','')+'00';
  var txt=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Pharmadiet Veterinary//Marcacoes//PT','CALSCALE:GREGORIAN','METHOD:PUBLISH','BEGIN:VEVENT','UID:'+SID+'@pharmadiet','DTSTAMP:'+s,'DTSTART:'+s,'DTEND:'+e,'SUMMARY:'+icsEsc('Visita Pharmadiet'+(c?(' — '+c):'')),'END:VEVENT','END:VCALENDAR'].join('\r\n');
  try{if(typeof Blob!=='undefined'&&typeof URL!=='undefined'&&URL.createObjectURL)return URL.createObjectURL(new Blob([txt],{type:'text/calendar;charset=utf-8'}));}catch(_){}
  return 'data:text/calendar;charset=utf-8,'+encodeURIComponent(txt);}
function lsGet(k){try{return localStorage.getItem(k);}catch(_){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(_){}}
function render(payloadPronto){
  var card=document.getElementById('card');
  // payloadPronto = JSON vindo do relé (link CURTO, ?i=<id>). Sem ele, lê-se o ?q= de sempre.
  var data=payloadPronto?dec2(payloadPronto):dec(new URLSearchParams(location.search).get('q'));
  // byDate = {iso:{starts,exA,exP}} (listas de 'HH:MM').
  // Formato do dia: [offset,[horas]] (2 elementos, links v:2 de 2026-07-27+) · [offset,[normal],
  // [exA],[exP]] (4 elementos, links 2026-07-23..26, sugestões de hora por chips) · [offset,
  // [horas],[]] (3 elementos, o 3.º era o busy e é ignorado — a página não expõe marcações do
  // calendário, decisão de segurança 2026-07-23). A deteção dos chips extra é pelo length>=4, por
  // isso o formato v:2 de 2 elementos degrada exatamente como o de 3. Em cada lista: >=24 =
  // minutos desde a meia-noite (ex. 850 = 14:10); <24 = hora inteira (links pré-2026-07-18).
  // Suporta ainda a máscara antiga e o ?s legado.
  // data.ad = dias ALTERNATIVOS pré-calculados, só nos links 2026-07-23..26 (mesma forma, offsets
  // relativos ao mesmo b, podem ser negativos). exA agenda logo; exP fica "sujeita a confirmação".
  // NADA disto vive nos links v:2 — ver o bloco NOVO mais abaixo.
  var byDate={}, altByDate={};
  var HRSm=['10:00','11:15','12:30','15:00','16:15'];
  function m2list(a){var o=[];(a||[]).forEach(function(v){o.push(m2h(v<24?v*60:v));});return o;}
  function addDia(map,base,pr){var dt=new Date(base);dt.setDate(dt.getDate()+pr[0]);var iso=isoOf(dt);var st=[];
    if(Object.prototype.toString.call(pr[1])==='[object Array]'){st=m2list(pr[1]);}
    else{for(var i=0;i<HRSm.length;i++){if(pr[1]&(1<<i))st.push(HRSm[i]);}}
    var novo=pr.length>=4;
    map[iso]={starts:st,exA:novo?m2list(pr[2]):[],exP:novo?m2list(pr[3]):[]};}
  if(data&&data.d&&data.b){ var base=parseD(data.b);
    data.d.forEach(function(pr){addDia(byDate,base,pr);});
    if(data.ad&&data.ad.length)data.ad.forEach(function(pr){addDia(altByDate,base,pr);});
  } else if(data&&data.s&&data.s.length){ data.s.forEach(function(iso){var dd=iso.slice(0,10),tt=iso.split('T')[1]||'10:00';
    /* Ramo LEGADO (`s`, links anteriores a 2026-07). No formato novo as horas passam pelo m2h()
       e são numéricas; aqui vinham cruas do payload e iam parar ao innerHTML dos chips — um
       `?q=` com `s:["2026-08-05T\" onclick=..."]` executava script nesta página. Não há sessão
       nem segredos aqui, mas é phishing num domínio de confiança. Uma hora ou é HH:MM ou não é
       hora. 2026-08-01. */
    var mm=/^(\d\d:\d\d)(:\d\d)?$/.exec(tt); if(!mm)return;   // tolera o ISO com segundos, rejeita tudo o resto
    (byDate[dd]=byDate[dd]||{starts:[],exA:[],exP:[]}).starts.push(mm[1]);}); }
  var dates=Object.keys(byDate).filter(function(k){return byDate[k].starts.length;}).sort();
  var altDates=Object.keys(altByDate).filter(function(k){var d2=altByDate[k];return (d2.starts.length||d2.exA.length||d2.exP.length)&&!byDate[k];}).sort();
  if(!dates.length){card.innerHTML='<h1>Link inválido</h1><p class="warn">Este link de marcação não tem datas. Por favor responda diretamente à mensagem.</p>';return;}
  // (2026-07-22, decisao do Bruno) os botoes "Confirmar por WhatsApp/email" foram removidos:
  // o rele + confirmacao automatica fecham o ciclo; fica so o "Adicionar ao meu calendario".
  // NOVO (links v:2, 2026-07-27): os chips exA/exP e os dias alternativos pré-calculados
  // desapareceram. "Prefere outra hora?" abre um seletor livre de hora (passos de 15 min) e
  // "Nenhum destes dias dá jeito?" abre um seletor de dia útil + hora — QUALQUER pedido por estas
  // vias é pendente (fila de Sugestões do Bruno). Toda a lógica nova está gated por este flag: os
  // links JÁ ENVIADOS (3/4 elementos, sem v) continuam a comportar-se exatamente como hoje.
  var NOVO=!!(data&&data.v>=2);
  /* O URL do relé NUNCA vem do payload (2026-08-01). Era `data.r||DEFAULT_R`, e o
     `rotaPickerPayload` nunca escreveu um `r` — o campo só podia existir num link forjado à mão.
     Um `?q=<base64>` construído por terceiros apontava assim o POST (com `k`, `c`, `slot`, `id`
     e o `w`) para um servidor arbitrário, a partir do domínio de confiança do GitHub Pages. Não
     vazava segredo novo, mas era uma exfiltração/redireção de graça. Código morto — fora. */
  var R=DEFAULT_R;
  var LSK='pharma_marcado_'+String(data.id||'');
  SID=String(data.id||(''+Date.now()));   // UMA vez por render: o retry reenvia o MESMO id
  var _sending=false;                     // guard de duplo clique (o botão também fica disabled)
  function done(isoT,reaberto,pend){
    // pend = hora fora da grelha, sujeita a aprovação do Bruno: texto próprio e SEM botão de
    // calendário (a marcação ainda não existe)
    var f=fmt(isoT);
    var html='<div class="sent">✓ '+(reaberto?'Marcação já enviada':'Pedido enviado')+' — '+f.wd+', '+f.dm+' às '+f.hr+'. '+(pend?'Vou confirmar a disponibilidade e dou-lhe resposta em breve.':'Confirmo consigo de seguida!')+'</div>';
    if(!pend)html+='<a class="btn cal" download="visita-pharmadiet.ics" href="'+icsHref(data.c,isoT)+'">📅 Adicionar ao meu calendário</a>';
    card.innerHTML=html;
  }
  // link já usado neste dispositivo → estado final direto, sem calendário (uso único; o relé
  // descarta de qualquer forma um 2.º pedido com o mesmo id). Valor 'ap|<isoT>' = pedido
  // pendente de confirmação → variante certa ao reabrir.
  var prev=data.id?lsGet(LSK):null;
  if(prev){var pd=prev.indexOf('ap|')===0;done(pd?prev.slice(3):prev,true,pd);return;}
  // calendário 4 semanas (Seg–Sex) a partir da segunda da 1.ª semana com vaga (oferecida ou alternativa)
  var start=parseD((altDates.length&&altDates[0]<dates[0])?altDates[0]:dates[0]); var off=(start.getDay()+6)%7; start.setDate(start.getDate()-off);
  var cells=[]; for(var w=0;w<4;w++){for(var wd=0;wd<5;wd++){var dt=new Date(start);dt.setDate(dt.getDate()+w*7+wd);cells.push(isoOf(dt));}}
  var lastc=parseD(cells[cells.length-1]);
  var titulo=MES[start.getMonth()]+(start.getMonth()!==lastc.getMonth()?(' – '+MES[lastc.getMonth()]):'');
  var h='<div class="panes">';
  h+='<h1>Olá! 👋 Escolha o dia e hora</h1>';
  h+='<div class="pane-cal">';
  h+='<div class="cal-h">'+titulo+'</div>';
  h+='<div class="dow">'+DOW.map(function(d){return '<span>'+d+'</span>';}).join('')+'</div><div class="grid">';
  cells.forEach(function(iso){var dt=parseD(iso);var num=dt.getDate();var mlbl=(num===1?('<small>'+MESc[dt.getMonth()]+'</small>'):'');
    var td=(iso===isoOf(new Date()))?' today':'';   // marca do dia de hoje (sempre no FIM da lista de classes)
    if(byDate[iso]&&byDate[iso].starts.length)h+='<div class="cell avail dot'+td+'" data-iso="'+iso+'">'+num+mlbl+'</div>';
    else if(altDates.indexOf(iso)>=0)h+='<div class="cell'+td+'" data-alt="'+iso+'">'+num+mlbl+'</div>';
    else h+='<div class="cell'+td+'">'+num+mlbl+'</div>';});
  h+='</div>';
  // dias alternativos: só ficam clicáveis (estilo .alt) depois do clique — uma vez, sem toggle;
  // dias impossíveis nem sequer vêm no payload (sem mensagens de impossibilidade)
  // v:2 → o botão está SEMPRE lá (abre o seletor livre de dia+hora); links antigos só o mostram
  // se o payload trouxer dias alternativos pré-calculados
  if(NOVO||altDates.length)h+='<button class="altbtn" type="button">Nenhum destes dias dá jeito?</button>';
  h+='</div><div class="pane-times" id="times"><p class="hint">Escolha um dia para ver as horas disponíveis.</p></div></div>';
  card.innerHTML=h;
  var timesEl=document.getElementById('times');
  card.querySelectorAll('.cell.avail').forEach(function(c){c.onclick=function(){pickDay(c.dataset.iso,c);};});
  card.querySelectorAll('.altbtn').forEach(function(b){b.onclick=function(){
    if(NOVO){pickFreeDay();return;}   // v:2: seletor livre de dia+hora (o botão fica, para se poder voltar a abrir)
    b.style.display='none';
    card.querySelectorAll('.cell').forEach(function(z){var ai=z.getAttribute&&z.getAttribute('data-alt');if(!ai)return;
      z.classList.add('alt');z.onclick=function(){pickDay(ai,z);};});
  };});
  // ---- seletores livres (v:2) ----
  // Horas 08–19 × minutos 00/15/30/45. A 1.ª opção é vazia de propósito: sem escolha explícita não
  // aparece botão de envio (o pedido é pendente, não se manda por engano).
  function selHoras(cls,val){var o='<option value="">--</option>';
    for(var H=8;H<=19;H++){var v=(H<10?'0':'')+H;o+='<option value="'+v+'"'+(val===v?' selected':'')+'>'+v+'h</option>';}
    return '<select class="'+cls+'">'+o+'</select>';}
  function selMinutos(cls,val){var o='';
    ['00','15','30','45'].forEach(function(v){o+='<option value="'+v+'"'+(val===v?' selected':'')+'>'+v+'</option>';});
    return '<select class="'+cls+'">'+o+'</select>';}
  var NOTA_PEND='Qualquer hora fora da lista precisa de confirmação da nossa parte';
  // Dias úteis das próximas 8 semanas a partir de AMANHÃ (56 dias < a janela de 60 do relé)
  function diasUteis(){var o=[],d=new Date();d.setHours(12,0,0,0);
    for(var i=1;i<=56;i++){var t=new Date(d);t.setDate(t.getDate()+i);var w=t.getDay();
      if(w===0||w===6)continue;o.push({iso:isoOf(t),lbl:WD[w].slice(0,3)+' '+('0'+t.getDate()).slice(-2)+'/'+('0'+(t.getMonth()+1)).slice(-2)});}
    return o;}
  // Painel "Nenhum destes dias dá jeito?": UM pedido único dia + hora, sempre pendente.
  function pickFreeDay(){
    card.querySelectorAll('.cell').forEach(function(z){z.classList.remove('sel');});
    var dias=diasUteis(), fdD='', fdH='', fdM='00', fdErr=false;
    function draw2(){
      var hh='<div class="times-h"><span class="th-wd">Outro dia</span></div>';
      hh+='<div class="freelbl">Que dia lhe dá jeito?</div>';
      hh+='<select class="freeday"><option value="">Escolha o dia</option>'
        +dias.map(function(d){return '<option value="'+d.iso+'"'+(fdD===d.iso?' selected':'')+'>'+d.lbl+'</option>';}).join('')+'</select>';
      hh+='<div class="freelbl">A que horas?</div><div class="freerow">'+selHoras('freeh',fdH)+selMinutos('freem',fdM)+'</div>';
      hh+='<div class="pend-note">'+NOTA_PEND+'</div>';
      if(fdErr){
        hh+='<div class="senderr">Não foi possível enviar o pedido. Verifique a ligação e tente de novo — ou responda diretamente à mensagem que recebeu.</div>'
          +'<button class="confbtn pend" type="button" data-t="'+fdH+':'+fdM+'" data-ap="1">Tentar novamente</button>';
      }else if(fdD&&fdH){
        var fs=fmt(fdD+'T'+fdH+':'+fdM);
        hh+='<button class="confbtn pend" type="button" data-t="'+fdH+':'+fdM+'" data-ap="1">Pedir este dia — '
          +fs.wd.slice(0,3)+', '+fs.dm+' às '+fs.hr+' (sujeito a confirmação)</button>';
      }
      timesEl.innerHTML=hh;
      timesEl.querySelectorAll('.freeday').forEach(function(s){s.onchange=function(){fdD=s.value||'';fdErr=false;draw2();};});
      timesEl.querySelectorAll('.freeh').forEach(function(s){s.onchange=function(){fdH=s.value||'';fdErr=false;draw2();};});
      timesEl.querySelectorAll('.freem').forEach(function(s){s.onchange=function(){fdM=s.value||'00';fdErr=false;draw2();};});
      timesEl.querySelectorAll('.confbtn').forEach(function(b){b.onclick=function(){
        enviar(fdD+'T'+fdH+':'+fdM,1,b,function(){fdErr=true;draw2();});};});
    }
    draw2();
    timesEl.scrollIntoView({behavior:'smooth',block:'nearest'});
  }
  // Envio fiável: só se considera enviado quando o fetch RESOLVE (resposta opaca do no-cors).
  // O try/catch síncrono anterior dava "Pedido enviado" com a rede em baixo — a promise rejeitava
  // depois, em silêncio, e o pedido nunca chegava ao relé. `onErr` devolve o controlo a quem
  // desenhou o painel (dia oferecido ou seletor livre), para o "Tentar novamente" aparecer lá.
  // NÃO se manda campo nenhum a dizer "dia livre": a app recalcula isso sozinha no poll.
  function enviar(isoT,ap,btnEl,onErr){
    if(_sending)return; _sending=true;
    if(btnEl){btnEl.disabled=true;btnEl.className='confbtn'+(ap?' pend':'')+' busy';btnEl.innerHTML='A enviar';}
    // s = assinatura do link longo (desde 14/09): so vale para este id e este cliente.
    // w = o segredo de escrita, que so os links longos ANTERIORES a 14/09 ainda trazem.
    // Nenhum dos dois esta embutido nesta pagina, que e publica: vem no payload do link.
    var body={k:data.k||'',c:data.c||'',slot:isoT,id:SID};
    if(data.s)body.s=data.s;
    if(data.w)body.w=data.w;
    if(ap)body.ap=1;
    var p; try{p=fetch(R,{method:'POST',mode:'no-cors',body:JSON.stringify(body)});}catch(e){p=Promise.reject(e);}
    var tm; var lim=new Promise(function(_,rej){tm=setTimeout(function(){rej(new Error('timeout'));},12000);});
    Promise.race([p,lim]).then(function(){
      clearTimeout(tm); _sending=false;
      if(data.id)lsSet(LSK,(ap?'ap|':'')+isoT);
      done(isoT,false,!!ap);
      card.scrollIntoView({behavior:'smooth',block:'start'});
    },function(){
      clearTimeout(tm); _sending=false; if(onErr)onErr();
    });
  }
  // O clique num chip SELECIONA (2026-07-27) — envia só o botão de confirmação por baixo. Um toque
  // acidental no telemóvel deixou de fazer uma marcação. Estado por painel de dia (selT/selAp/
  // errState) + draw() a re-renderizar o painel inteiro, no estilo do resto da página. Expandir
  // "Prefere outra hora?" abre um closure novo → perde a seleção (aceite).
  function pickDay(iso,cell,expand){
    card.querySelectorAll('.cell').forEach(function(z){z.classList.remove('sel');});
    cell.classList.add('sel');
    var f=fmt(iso+'T00:00'); var day=byDate[iso]||altByDate[iso];
    var selT=null,selAp=0,errState=false,first=true;
    var freeOpen=false,freeH='',freeM='00';   // v:2: seletor livre de hora dentro DESTE dia
    function draw(){
      var hh='<div class="times-h"><span class="th-wd">'+f.wd+'</span><span class="th-sep">, </span><span class="th-dm">'+f.dm+'</span></div>';
      hh+='<div class="slots">';
      // expand ("Prefere outra hora?" nos links ANTIGOS): junta exA (iguais às normais, fluxo
      // automático) e exP (tracejadas, data-ap=1 → sujeitas a confirmação do Bruno), cronológico
      var chips=day.starts.map(function(t){return {t:t,ap:0};});
      if(expand){day.exA.forEach(function(t){chips.push({t:t,ap:0});});day.exP.forEach(function(t){chips.push({t:t,ap:1});});}
      chips.sort(function(a,b){return a.t<b.t?-1:(a.t>b.t?1:0);});
      // o chip só fica selecionado se a ESCOLHA for dele: a hora livre tem sempre ap=1, por isso
      // uma hora livre que calhe coincidir com um chip não o acende (são mutuamente exclusivos)
      chips.forEach(function(c2){hh+='<button class="chip'+(c2.ap?' pend':'')+((c2.t===selT&&c2.ap===selAp)?' sel':'')+'" data-t="'+c2.t+'"'+(c2.ap?' data-ap="1"':'')+'>'+c2.t.replace(':','h')+'</button>';});
      hh+='</div>';
      if(NOVO){
        // v:2: o "Prefere outra hora?" abre o seletor livre (não há chips extra); a lista de horas
        // do dia continua visível por cima e a seleção sobrevive a abrir/usar o seletor
        if(!freeOpen)hh+='<button class="morebtn" type="button">Prefere outra hora?</button>';
        else hh+='<div class="freelbl">Outra hora neste dia:</div><div class="freerow">'+selHoras('freeh',freeH)+selMinutos('freem',freeM)+'</div>'
                +'<div class="pend-note">'+NOTA_PEND+'</div>';
      }else{
        if(!expand&&(day.exA.length||day.exP.length))hh+='<button class="morebtn" type="button">Prefere outra hora?</button>';
        if(expand&&day.exP.length)hh+='<div class="pend-note">Horas assinaladas: sujeitas a confirmação da nossa parte</div>';
      }
      if(errState){
        hh+='<div class="senderr">Não foi possível enviar o pedido. Verifique a ligação e tente de novo — ou responda diretamente à mensagem que recebeu.</div>'
          +'<button class="confbtn'+(selAp?' pend':'')+'" type="button" data-t="'+selT+'"'+(selAp?' data-ap="1"':'')+'>Tentar novamente</button>';
      }else if(selT){
        var fs=fmt(iso+'T'+selT);
        hh+='<button class="confbtn'+(selAp?' pend':'')+'" type="button" data-t="'+selT+'"'+(selAp?' data-ap="1"':'')+'>'
          +(selAp?'Pedir esta hora':'Confirmar')+' — '+fs.wd.slice(0,3)+', '+fs.dm+' às '+fs.hr+(selAp?' (sujeita a confirmação)':'')+'</button>';
      }
      timesEl.innerHTML=hh;
      timesEl.querySelectorAll('.chip').forEach(function(b){b.onclick=function(){selT=b.dataset.t;selAp=String(b.dataset.ap||'')==='1'?1:0;errState=false;draw();};});
      timesEl.querySelectorAll('.morebtn').forEach(function(b){b.onclick=function(){if(NOVO){freeOpen=true;draw();}else pickDay(iso,cell,true);};});
      timesEl.querySelectorAll('.freeh').forEach(function(s){s.onchange=function(){freeH=s.value||'';errState=false;
        if(freeH){selT=freeH+':'+freeM;selAp=1;}else if(selAp){selT=null;} draw();};});
      timesEl.querySelectorAll('.freem').forEach(function(s){s.onchange=function(){freeM=s.value||'00';errState=false;
        if(freeH){selT=freeH+':'+freeM;selAp=1;} draw();};});
      timesEl.querySelectorAll('.confbtn').forEach(function(b){b.onclick=function(){enviar(iso+'T'+selT,selAp,b,function(){errState=true;draw();});};});
      if(first){first=false;timesEl.scrollIntoView({behavior:'smooth',block:'nearest'});}
    }
    draw();
  }
}
/* LINK CURTO (2026-07-27). Dois formatos de link, e os dois têm de continuar a funcionar:
     ?q=<base64>  — o payload inteiro no URL (todos os links enviados até 27/07). Nada muda.
     ?i=<id>      — só o id; o payload vem do relé (doGet action=load). ~75 caracteres em vez
                    de ~450, porque os links longos chegavam partidos ao telemóvel.
   Se o relé não responder, mostra-se um erro claro em vez de "link inválido" — a causa é
   outra (rede/relé em baixo) e o cliente merece saber que o link está bom. */
function dec2(s){ try{ return JSON.parse(s); }catch(e){ return null; } }
function ecra(t,p){ document.getElementById('card').innerHTML='<h1>'+t+'</h1><p class="warn">'+p+'</p>'; }
function arranque(){
  var i=''; try{ i=new URLSearchParams(location.search).get('i')||''; }catch(e){}
  if(!i){ render(); return; }                      // link ?q= de sempre
  ecra('Um momento…','A carregar as datas disponíveis.');
  var to=setTimeout(function(){ ecra('Sem ligação','Não consegui carregar as datas. Verifique a ligação e volte a abrir o link, ou responda diretamente à mensagem.'); },15000);
  fetch(DEFAULT_R+'?action=load&i='+encodeURIComponent(i))
    .then(function(r){ return r.json(); })
    .then(function(j){
      clearTimeout(to);
      if(j&&j.ok&&j.p)render(j.p);
      else ecra('Link inválido','Este link já não é válido. Por favor responda diretamente à mensagem.');
    })
    .catch(function(){
      clearTimeout(to);
      ecra('Sem ligação','Não consegui carregar as datas. Verifique a ligação e volte a abrir o link, ou responda diretamente à mensagem.');
    });
}
arranque();
</script>
