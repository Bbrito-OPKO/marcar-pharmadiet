<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marcar visita — Pharmadiet Veterinary</title>
<meta property="og:title" content="Marcar visita — Pharmadiet Veterinary">
<meta property="og:description" content="Escolha o dia e a hora que lhe der mais jeito para a visita da Pharmadiet.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#175FAA">
<style>
  :root{--navy:#175FAA;--navy-d:#134F8E;--green:#87BA25;--green-d:#6f9a1e;--ink:#2B3441;--muted:#6C7889;--line:#E2E8F0;--bg:#F4F7FB}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}
  .wrap{max-width:900px;margin:0 auto;padding:24px 16px 48px}
  .brand{display:flex;justify-content:center;margin-bottom:18px}
  .brand img{height:46px;max-width:72vw;object-fit:contain}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 28px rgba(20,40,70,.06);padding:24px 22px}
  h1{font-size:20px;margin:0 0 18px;grid-column:1;white-space:nowrap}
  .panes{display:grid;grid-template-columns:1fr max-content;grid-template-rows:auto 1fr;gap:0 22px;min-height:360px}
  .pane-cal{grid-column:1;grid-row:2;display:flex;flex-direction:column}
  .pane-times{grid-column:2;grid-row:1/3;border-left:1px solid var(--line);padding:0 18px;display:flex;flex-direction:column}
  .cal-h{font-weight:800;color:var(--navy);font-size:17px;text-transform:capitalize;margin-bottom:12px}
  .dow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:8px}
  .dow span{text-align:center;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;flex:1;grid-auto-rows:minmax(96px,1fr)}
  .cell{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:17px;border-radius:14px;color:#C5CED9}
  .cell small{font-size:10px;line-height:1;margin-top:2px;opacity:.8}
  .cell.avail{background:#EAF2FB;color:var(--navy);font-weight:800;cursor:pointer;border:1.5px solid transparent;transition:.15s}
  .cell.avail:hover{border-color:#9CC0E8}
  .cell.avail.dot::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--green);margin-top:3px}
  .cell.alt{background:#fff;color:var(--navy);font-weight:800;cursor:pointer;border:1.5px dashed var(--line);transition:.15s}
  .cell.alt:hover{border-color:#9CC0E8}
  .cell.sel{background:var(--navy);color:#fff}
  .cell.sel.dot::after{background:#fff}
  .cell.alt.sel{background:var(--navy);color:#fff;border-style:solid}
  .cell.today{box-shadow:inset 0 0 0 1.5px #B9D3EE;border-radius:14px}
  .times-h{font-weight:800;color:var(--navy);font-size:16px;text-transform:capitalize;margin-bottom:12px;text-align:center;white-space:nowrap}
  .hint{color:var(--muted);font-size:14px;line-height:1.5;margin-top:36px;text-align:center;max-width:170px}
  .slots{display:flex;flex-direction:column;gap:6px}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 6px;font-size:14px;font-weight:800;color:var(--navy);cursor:pointer;transition:.15s;text-align:center}
  .chip:hover{border-color:#9CC0E8;background:#F3F8FF}
  .chip.sel{border-color:var(--navy);background:var(--navy);color:#fff}
  .chip.pend{border-style:dashed}
  .chip.pend.sel{border-style:solid}
  .pend-note{color:var(--muted);font-size:11px;line-height:1.4;margin-top:6px;text-align:center;max-width:170px}
  /* seletores livres (2026-07-27): hora fora da grelha e dia fora dos propostos. TODOS capados a
     170px pela mesma razão do .hint/.pend-note/.confbtn — a coluna das horas é max-content */
  /* 16/10 (pedido do Bruno): as caixas de dia e hora vestem-se como os dias do calendário
     (.cell.avail: fundo azul-claro, texto azul, sem moldura) e o texto vai CENTRADO. O
     appearance:none tira a seta do sistema, que empurrava o texto para a esquerda; o
     text-align-last é o que centra no Chrome/Android (o text-align sozinho não chega lá).
     As horas são .freeh/.freem (o nome que o selHoras/selMinutos lhes dá); a regra antiga
     chamava-lhes .freesel e nunca pegou — as caixas saíam com o aspeto do sistema. */
  .freelbl{color:var(--muted);font-size:12px;font-weight:700;line-height:1.35;margin:12px auto 0;text-align:center;max-width:170px}
  .freerow{display:flex;justify-content:center;gap:6px;margin:6px auto 0;width:100%;max-width:170px}
  .freeh,.freem,.freeday{-webkit-appearance:none;-moz-appearance:none;appearance:none;border:1.5px solid transparent;border-radius:14px;background:#EAF2FB;color:var(--navy);font-size:14px;font-weight:800;font-family:inherit;text-align:center;text-align-last:center;cursor:pointer;transition:.15s;min-height:44px}
  .freeh,.freem{flex:1;min-width:0;padding:10px 4px}
  .freeday{display:block;width:100%;max-width:170px;margin:6px auto 0;padding:10px 6px}
  .freeh:focus,.freem:focus,.freeday:focus{outline:none;border-color:#9CC0E8}
  .freeh option,.freem option,.freeday option{text-align:left}
  /* passo de confirmacao (2026-07-27): o chip so SELECIONA, e este botao e que envia */
  /* max-width 170px pela MESMA razão do .hint/.pend-note: a coluna das horas é max-content e o
     texto do botão, sem cap, esticava o card inteiro (medido: 484px de scroll a 320px de ecrã) */
  .confbtn{display:block;width:100%;max-width:170px;margin-top:10px;border:none;border-radius:12px;padding:11px 10px;font-size:13.5px;font-weight:800;color:#fff;background:var(--green);cursor:pointer;line-height:1.35;transition:.15s;animation:confin .18s ease-out}
  .confbtn:hover{background:var(--green-d)}
  .confbtn.pend{background:var(--navy)}
  .confbtn.pend:hover{background:var(--navy-d)}
  .confbtn[disabled]{opacity:.6;cursor:default}
  .confbtn:active,.chip:active,.cell.avail:active,.cell.alt:active{transform:scale(.98)}
  .busy::after{content:"";animation:dots 1.2s steps(1,end) infinite}
  @keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
  @keyframes confin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .senderr{color:#C0392B;font-size:12px;line-height:1.45;margin-top:10px;text-align:center;max-width:170px}
  /* 16/10 (pedido do Bruno): "Nenhum destes dias dá jeito?" e "Prefere outra hora?" mais
     destacados — eram tracejado cinzento e passavam por desativados. Hoje são o botão
     secundário da página (o mesmo do "Adicionar ao meu calendário"): moldura e texto azuis. */
  .altbtn,.morebtn{background:#fff;border:1.5px solid var(--navy);border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:800;color:var(--navy);cursor:pointer;transition:.15s;font-family:inherit}
  .altbtn{margin-top:12px}
  .morebtn{display:block;width:100%;max-width:170px;margin:8px auto 0;padding:9px 6px;font-size:13px}
  @media (hover:hover){.altbtn:hover,.morebtn:hover{background:#EAF2FB}}
  .sent{background:var(--green);color:#fff;border:2px solid var(--green-d);border-radius:14px;padding:14px 16px;font-size:15px;font-weight:800;line-height:1.45;margin:6px 0 12px;text-align:center}
  .sent.duv{background:#FFF7E0;color:var(--ink);border-color:#E0B040}
.warn{font-size:14px;color:var(--ink);margin:6px 0 12px;line-height:1.5}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:800;cursor:pointer;margin-bottom:10px;text-decoration:none;color:#fff}
  .btn.cal{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
  .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}
  .err{color:#C0392B;font-size:14px}
  /* v:3 (11/11/2026, fase 3): as 3 horas reservadas -- um botao grande por hora, sem calendario */
  .tres-h1{white-space:normal}
  .hint3{color:var(--muted);font-size:14px;line-height:1.5;margin:-8px 0 12px}
  .tres{display:flex;flex-direction:column;gap:10px;max-width:420px}
  .opc{border:1.5px solid transparent;background:#EAF2FB;border-radius:14px;padding:14px 16px;font-size:16px;font-weight:800;color:var(--navy);cursor:pointer;text-align:left;font-family:inherit;transition:.15s;min-height:52px}
  .opc .opc-wd{text-transform:capitalize}
  @media (hover:hover){.opc:hover{border-color:#9CC0E8}}
  .opc.sel{background:var(--navy);color:#fff}
  .opc:active{transform:scale(.98)}
  .confbtn.tres-conf,.tres-err{max-width:420px}
  .tres-livre{margin-top:6px;max-width:420px}
  @media(max-width:759.98px){
    .panes{gap:0 12px;min-height:300px}
    h1{font-size:13px;margin-bottom:14px}   /* 14px foi testado e TRANSBORDA a 320px (o h1 é nowrap e puxa a coluna do calendário) */
    .pane-times{padding:0 12px}
    .cell{font-size:14px;border-radius:10px}
    .cell.today{border-radius:10px}
    .cell small{font-size:9px}
    .dow span{font-size:10px}
    .grid,.dow{gap:5px}
    .grid{grid-auto-rows:minmax(64px,1fr)}
    .chip{padding:7px 5px;font-size:12.5px;min-height:40px;display:flex;align-items:center;justify-content:center}
    .confbtn{min-height:40px;font-size:12.5px;padding:9px 8px;margin-top:8px;max-width:140px}
    .senderr{font-size:11px;max-width:140px}
    .altbtn{font-size:12px;padding:8px 10px}
    .morebtn{font-size:11.5px;padding:8px 5px;max-width:140px}
    .pend-note{font-size:9.5px;max-width:140px}
    .freelbl{font-size:10.5px;max-width:140px;margin-top:10px}
    .freerow{max-width:140px;gap:4px}
    .freeh,.freem,.freeday{font-size:13px;padding:8px 3px;min-height:40px;border-radius:10px}
    .freeday{max-width:140px}
    .times-h{font-size:12.5px;white-space:normal}
    .times-h .th-wd{white-space:nowrap}
    .hint{max-width:140px}
    .times-h .th-sep{display:none}
    .times-h .th-dm{display:block}
    .hint{margin-top:16px;font-size:13px}
    .cal-h{font-size:15px}
  }
  .janela{position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
  .janela[hidden]{display:none}
  .janela-fundo{position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(20,40,70,.45)}
  .janela-caixa{position:relative;width:100%;max-width:340px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 36px rgba(20,40,70,.25);padding:44px 22px 22px;text-align:center}
  .janela-x{position:absolute;top:4px;right:4px;width:44px;height:44px;border:none;border-radius:12px;background:transparent;font-size:28px;line-height:1;color:var(--muted);cursor:pointer;font-family:inherit}
  .janela-txt{font-size:18px;font-weight:700;color:var(--ink);line-height:1.45;margin:0 0 20px}
  .janela-ok{display:block;width:100%;border:none;border-radius:12px;padding:13px 10px;font-size:15px;font-weight:800;color:#fff;background:var(--green);cursor:pointer;font-family:inherit;min-height:44px}
  @media (hover:hover){.janela-x:hover{background:#EAF2FB}.janela-ok:hover{background:var(--green-d)}}
</style>
</head>

<script>
var DEFAULT_R='https://script.google.com/macros/s/AKfycbzedS0F01jmcMy-mLf4deECfyUr5feSak9e1M5NHlccfUU4dC1dpwNxmg722aRKjBej7g/exec';
var DUR_MIN=30;   // duração da reunião mostrada ao cliente e usada no "Adicionar ao calendário"
var SID='';       // id do pedido: gerado UMA vez por render (o relé dedupa por id → retry não duplica)
var WD=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
var DOW=['Seg','Ter','Qua','Qui','Sex'];
var MES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
var MESc=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function dec(q){if(!q)return null;try{return JSON.parse(decodeURIComponent(escape(atob(q))));}catch(e){try{return JSON.parse(decodeURIComponent(q));}catch(_){return null;}}}
function parseD(iso){var d=iso.slice(0,10).split('-');return new Date(+d[0],+d[1]-1,+d[2]);}
function isoOf(dt){return dt.getFullYear()+'-'+('0'+(dt.getMonth()+1)).slice(-2)+'-'+('0'+dt.getDate()).slice(-2);}
function m2h(m){var H=Math.floor(m/60),M=m%60;return (H<10?'0':'')+H+':'+(M<10?'0':'')+M;}
function fmt(iso){var p=iso.split('T');var dt=parseD(p[0]);return {wd:WD[dt.getDay()],dm:p[0].split('-')[2]+'/'+p[0].split('-')[1],hr:(p[1]||'10:00').replace(':00','h').replace(':','h'),date:p[0],time:(p[1]||'10:00')};}
// .ics unico (2026-07-27, decisao do Bruno): substitui o link do Google Calendar — importa em
// iPhone/Outlook/Google. Horas FLUTUANTES (sem Z/timezone): o evento fica na hora local de quem
// abre, que e a hora da visita. Blob primario (melhor no Safari do iPhone), data URI em fallback
// por feature-test (e tambem o caminho dos sandboxes dos testes, sem Blob/URL).
function icsEsc(s){return String(s).replace(/([\\;,])/g,'\\$1').replace(/\n/g,'\\n');}
function icsHref(c,isoT){var p=isoT.split('T');var d=p[0].replace(/-/g,'');var t=(p[1]||'10:00');
  var ini=(+t.split(':')[0])*60+(+t.split(':')[1]);var fim=ini+DUR_MIN;
  var s=d+'T'+t.replace(':','')+'00';var e=d+'T'+m2h(fim).replace(':','')+'00';
  var txt=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Pharmadiet Veterinary//Marcacoes//PT','CALSCALE:GREGORIAN','METHOD:PUBLISH','BEGIN:VEVENT','UID:'+SID+'@pharmadiet','DTSTAMP:'+s,'DTSTART:'+s,'DTEND:'+e,'SUMMARY:'+icsEsc('Visita Pharmadiet'+(c?(' — '+c):'')),'END:VEVENT','END:VCALENDAR'].join('\r\n');
  try{if(typeof Blob!=='undefined'&&typeof URL!=='undefined'&&URL.createObjectURL)return URL.createObjectURL(new Blob([txt],{type:'text/calendar;charset=utf-8'}));}catch(_){}
  return 'data:text/calendar;charset=utf-8,'+encodeURIComponent(txt);}
function lsGet(k){try{return localStorage.getItem(k);}catch(_){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(_){}}
/* O AVISO DE HORA RECUSADA (`ocupada` e `impossivel`): uma janela no meio do ecrã, por cima de um
   fundo escurecido, com o texto, um X e o botão "Escolher outra hora". Fecha com o X, com o botão,
   com um toque no fundo e com a tecla Esc; ao fechar, o foco vai para a lista de horas. Enquanto
   está aberta, nenhum pedido sai (`enviar`). É um elemento só (`#janela`, no HTML): uma recusa
   seguida troca-lhe o texto, não abre outra. Sem `#janela` (página antiga num teste), não abre. */
var AVISO_OCUPADA='Essa hora já não está disponível. Escolha outra, por favor.';
var RECUSADAS=[];   // 'yyyy-mm-ddTHH:MM' das horas da lista que o relé recusou nesta página
function janelaAberta(){var j=document.getElementById('janela');return !!(j&&j.hidden===false);}
function janelaFechar(){
  var j=document.getElementById('janela'); if(!j||j.hidden!==false)return;
  j.hidden=true; j.innerHTML='';
  var t=document.getElementById('times'), c=t&&t.querySelectorAll?t.querySelectorAll('.chip')[0]:null;
  if(c&&typeof c.focus==='function')c.focus();
}
function janelaAbrir(txt){
  var j=document.getElementById('janela'); if(!j)return;
  j.innerHTML='<div class="janela-fundo"></div><div class="janela-caixa" role="alertdialog" aria-modal="true" aria-labelledby="janela-txt">'
    +'<button class="janela-x" type="button" aria-label="Fechar">×</button>'
    +'<p class="janela-txt" id="janela-txt">'+txt+'</p>'
    +'<button class="janela-ok" type="button">Escolher outra hora</button></div>';
  j.hidden=false;
  j.querySelectorAll('.janela-x')[0].onclick=janelaFechar;
  j.querySelectorAll('.janela-ok')[0].onclick=janelaFechar;
  j.querySelectorAll('.janela-fundo')[0].onclick=janelaFechar;
  var ok=j.querySelectorAll('.janela-ok')[0]; if(typeof ok.focus==='function')ok.focus();

         (responda à mensagem) em vez de confirmar uma hora que pode não ser a marcada. */
      if(j&&j.ok===false&&!(j.error==='used'&&_tentativas>1&&_horas.every(function(h){return h===isoT;}))){recusado(j.error);return;}
      if(data.id&&!r.cego)lsSet(LSK,(ap?'ap|':'')+isoT);
      done(isoT,false,!!ap,r.cego);
      card.scrollIntoView({behavior:'smooth',block:'start'});
    },function(){
      _sending=false; if(onErr)onErr();
    });
  }
  var _tentativas=0, _horas=[];   // as horas de cada pedido feito ao relé nesta página
  /* `ocupada` / `impossivel` (só links v:4): a hora já não serve (outro cliente, ou a agenda do
     Bruno). Volta a pedir-se a agenda e redesenha-se no MESMO ecrã, com o mesmo dia aberto, e abre-se
     a janela do aviso (`txt`; sem ele, o do `ocupada`). Num pedido a uma hora da lista (`ocupada`)
     essa hora entra nas `RECUSADAS`, e todas as `RECUSADAS` saem SEMPRE da lista redesenhada, mesmo
     que a 2.ª leitura as traga outra vez; no pedido livre (`impossivel`) a lista fica como veio. Se a 2.ª leitura falhar, desenha-se a lista que
     estava no ecrã. O relé não gastou o id: o próximo pedido leva o mesmo (o SID sai do `id`). */
  function semHora(v,dia,hora){
    var b0=parseD(v.b), o={};
    for(var k in v){if(Object.prototype.hasOwnProperty.call(v,k))o[k]=v[k];}
    o.d=v.d.map(function(pr){var dt=new Date(b0);dt.setDate(dt.getDate()+pr[0]);
      if(isoOf(dt)!==dia)return pr;
      return [pr[0],pr[1].filter(function(x){return m2h(x<24?x*60:x)!==hora;})];});
    return o;
  }
  function ocupada(isoT,txt){
    var dia=isoT.slice(0,10);
    pedirAgenda(String(DADO.id||''),function(nova){
      if(!nova)nova={b:data.b,d:data.d};
      if(!txt&&RECUSADAS.indexOf(isoT)<0)RECUSADAS.push(isoT);
      if(!txt)RECUSADAS.forEach(function(r){nova=semHora(nova,r.slice(0,10),r.slice(11,16));});
      render(payloadPronto,nova,dia);
      janelaAbrir(txt||AVISO_OCUPADA);
    });
  }
  function lerResposta(r){
    if(!r||typeof r.json!=='function'||r.type==='opaque')return null;
    return Promise.resolve().then(function(){return r.json();}).then(function(j){return (j&&typeof j==='object')?j:null;},function(){return null;});
  }
  /* O relé disse que não: diz-se ao cliente porquê, em palavras dele, e o que fazer. */
  function recusado(err){
    var t,m;
    if(err==='used'){t='Este link já foi usado';m='Já foi pedida uma visita com este link. Se quiser mudar o dia ou a hora, responda diretamente à mensagem que recebeu.';}
    else if(err==='slot fora da janela'||err==='slot invalido'){t='Esse dia já não pode ser marcado';m='Esse dia já passou ou está fora do prazo deste link. Por favor responda diretamente à mensagem que recebeu e combinamos outro dia.';}
    else if(err==='limite diario'){t='Não foi possível registar o pedido';m='Não consegui registar o pedido agora. Por favor responda diretamente à mensagem que recebeu e trato da marcação consigo.';}
    else if(err==='auth'||err==='k'){t='Este link já não é válido';m='Não foi possível marcar com este link. Por favor responda diretamente à mensagem que recebeu.';}
    /* Erro que a página não conhece (o relé ocupado, uma exceção passageira): o link está bom,
       por isso nunca se diz que "já não é válido". Só `auth` e `k` são o link. */
    else{t='Não foi possível registar o pedido';m='Não consegui registar o pedido agora. Por favor responda diretamente à mensagem que recebeu e trato da marcação consigo.';}
    ecra(t,m);
    card.scrollIntoView({behavior:'smooth',block:'start'});
  }
  // O clique num chip SELECIONA (2026-07-27) — envia só o botão de confirmação por baixo. Um toque
  // acidental no telemóvel deixou de fazer uma marcação. Estado por painel de dia (selT/selAp/
  // errState) + draw() a re-renderizar o painel inteiro, no estilo do resto da página. Expandir
  // "Prefere outra hora?" abre um closure novo → perde a seleção (aceite).
  function pickDay(iso,cell,expand){
    card.querySelectorAll('.cell').forEach(function(z){z.classList.remove('sel');});
    cell.classList.add('sel');
    var f=fmt(iso+'T00:00'); var day=byDate[iso]||altByDate[iso];
    var selT=null,selAp=0,errState=false,first=true;
    var freeOpen=false,freeH='',freeM='00';   // v:2: seletor livre de hora dentro DESTE dia
    function draw(){
      var hh='<div class="times-h"><span class="th-wd">'+f.wd+'</span><span class="th-sep">, </span><span class="th-dm">'+f.dm+'</span></div>';
      hh+='<div class="slots">';
      // expand ("Prefere outra hora?" nos links ANTIGOS): junta exA (iguais às normais, fluxo
      // automático) e exP (tracejadas, data-ap=1 → sujeitas a confirmação do Bruno), cronológico
      var chips=day.starts.map(function(t){return {t:t,ap:0};});
      if(expand){day.exA.forEach(function(t){chips.push({t:t,ap:0});});day.exP.forEach(function(t){chips.push({t:t,ap:1});});}
      chips.sort(function(a,b){return a.t<b.t?-1:(a.t>b.t?1:0);});
      // o chip só fica selecionado se a ESCOLHA for dele: a hora livre tem sempre ap=1, por isso
      // uma hora livre que calhe coincidir com um chip não o acende (são mutuamente exclusivos)
      chips.forEach(function(c2){hh+='<button class="chip'+(c2.ap?' pend':'')+((c2.t===selT&&c2.ap===selAp)?' sel':'')+'" data-t="'+c2.t+'"'+(c2.ap?' data-ap="1"':'')+'>'+c2.t.replace(':','h')+'</button>';});
      hh+='</div>';
      if(NOVO){
        // v:2: o "Prefere outra hora?" abre o seletor livre (não há chips extra); a lista de horas
        // do dia continua visível por cima e a seleção sobrevive a abrir/usar o seletor
        if(!freeOpen)hh+='<button class="morebtn" type="button">Prefere outra hora?</button>';
        else hh+='<div class="freelbl">Outra hora neste dia:</div><div class="freerow">'+selHoras('freeh',freeH,iso)+selMinutos('freem',freeM,iso,freeH)+'</div>'
                +'<div class="pend-note">'+NOTA_PEND+'</div>';
      }else{
        if(!expand&&(day.exA.length||day.exP.length))hh+='<button class="morebtn" type="button">Prefere outra hora?</button>';
        if(expand&&day.exP.length)hh+='<div class="pend-note">Horas assinaladas: sujeitas a confirmação da nossa parte</div>';
      }
      if(selT&&selAp&&horaImp(iso,selT)){
        hh+='<div class="senderr">'+AVISO_HORA_IMP+'</div>';
      }else if(errState){
        hh+='<div class="senderr">Não foi possível enviar o pedido. Verifique a ligação e tente de novo — ou responda diretamente à mensagem que recebeu.</div>'
          +'<button class="confbtn'+(selAp?' pend':'')+'" type="button" data-t="'+selT+'"'+(selAp?' data-ap="1"':'')+'>Tentar novamente</button>';
      }else if(selT){
        var fs=fmt(iso+'T'+selT);
        hh+='<button class="confbtn'+(selAp?' pend':'')+'" type="button" data-t="'+selT+'"'+(selAp?' data-ap="1"':'')+'>'
          +(selAp?'Pedir esta hora':'Confirmar')+' — '+fs.wd.slice(0,3)+', '+fs.dm+' às '+fs.hr+(selAp?' (sujeita a confirmação)':'')+'</button>';
      }
      timesEl.innerHTML=hh;
      timesEl.querySelectorAll('.chip').forEach(function(b){b.onclick=function(){selT=b.dataset.t;selAp=String(b.dataset.ap||'')==='1'?1:0;errState=false;draw();};});
      timesEl.querySelectorAll('.morebtn').forEach(function(b){b.onclick=function(){if(NOVO){freeOpen=true;draw();}else pickDay(iso,cell,true);};});
      timesEl.querySelectorAll('.freeh').forEach(function(s){s.onchange=function(){freeH=s.value||'';errState=false;
        if(freeH){selT=freeH+':'+freeM;selAp=1;}else if(selAp){selT=null;} draw();};});
      timesEl.querySelectorAll('.freem').forEach(function(s){s.onchange=function(){freeM=s.value||'00';errState=false;
        if(freeH){selT=freeH+':'+freeM;selAp=1;} draw();};});
      timesEl.querySelectorAll('.confbtn').forEach(function(b){b.onclick=function(){enviar(iso+'T'+selT,selAp,b,function(){errState=true;draw();});};});
      if(first){first=false;timesEl.scrollIntoView({behavior:'smooth',block:'nearest'});}
    }
    draw();
  }
  /* v:3 -- AS HORAS RESERVADAS (11/11/2026, fase 3 do desenho "3 horas reservadas"). O link leva SO as
     horas guardadas para este cliente (uma por dia; 3, ou 2 quando nao ha maneira de fazer 3). Em vez
     do calendario: um botao por hora e, por baixo, "Nenhuma da -- propor outro dia/hora", que abre o
     seletor livre de sempre (`pickFreeDay`: o pedido vai com `ap=1` e cai nas Sugestoes do Bruno). O
     toque numa hora SELECIONA; o botao verde de baixo e que envia -- o mesmo passo de confirmacao dos
     chips, pela mesma razao (um toque acidental no telemovel nao marca nada). As horas que ja passaram
     ja sairam no `semPassado`. Os links v:2 e anteriores nao passam aqui: continuam com o calendario.
     Corre no FIM do `render` de proposito: o `_tentativas` e o `NOTA_PEND` (que o `enviar` e o
     `pickFreeDay` usam) so ficam com valor depois de declarados mais acima. */
  if(data.v===3){
    var opc=[]; dates.forEach(function(iso){byDate[iso].starts.forEach(function(t){opc.push(iso+'T'+t);});});
    var selO=null, errO=false;
    var drawTres=function(){
      var hh='<h1 class="tres-h1">Olá! 👋 Guardei estas horas para si</h1><p class="hint3">Escolha a que lhe der mais jeito:</p><div class="tres">';
      opc.forEach(function(o){var f=fmt(o);hh+='<button class="opc'+(o===selO?' sel':'')+'" type="button" data-o="'+o+'"><span class="opc-wd">'+f.wd+'</span>, '+f.dm+' às '+f.hr+'</button>';});
      hh+='</div>';
      if(errO){
        hh+='<div class="senderr tres-err">Não foi possível enviar o pedido. Verifique a ligação e tente de novo — ou responda diretamente à mensagem que recebeu.</div>'
          +'<button class="confbtn tres-conf" type="button">Tentar novamente</button>';
      }else if(selO){
        var fs=fmt(selO);
        hh+='<button class="confbtn tres-conf" type="button">Confirmar — '+fs.wd.slice(0,3)+', '+fs.dm+' às '+fs.hr+'</button>';
      }
      hh+='<button class="altbtn" type="button">Nenhuma dá — propor outro dia/hora</button><div class="pane-times tres-livre" id="times"></div>';
      card.innerHTML=hh;
      timesEl=document.getElementById('times');
      timesEl.style.borderLeft='none'; timesEl.style.padding='0';
      card.querySelectorAll('.opc').forEach(function(b){b.onclick=function(){selO=b.getAttribute('data-o');errO=false;drawTres();};});
      card.querySelectorAll('.confbtn.tres-conf').forEach(function(b){b.onclick=function(){enviar(selO,0,b,function(){errO=true;drawTres();});};});
      card.querySelectorAll('.altbtn').forEach(function(b){b.onclick=function(){
        selO=null; errO=false;
        card.querySelectorAll('.opc').forEach(function(z){z.classList.remove('sel');});
        card.querySelectorAll('.confbtn.tres-conf,.tres-err').forEach(function(z){z.parentNode.removeChild(z);});
        pickFreeDay();};});
    };
    drawTres();
  }
  // v:4 depois de um `ocupada`: o dia que estava aberto volta a abrir-se, se ainda tiver horas
  if(abrirDia&&data.v===4){card.querySelectorAll('.cell.avail').forEach(function(c){if(c.dataset.iso===abrirDia)pickDay(abrirDia,c);});}
  if(vivaVazia)pickFreeDay();   // v:4 sem dias livres: o seletor de outro dia já aberto
}
/* LINK CURTO (2026-07-27). Dois formatos de link, e os dois têm de continuar a funcionar:
     ?q=<base64>  — o payload inteiro no URL (todos os links enviados até 27/07). Nada muda.
     ?i=<id>      — só o id; o payload vem do relé (doGet action=load). ~75 caracteres em vez
                    de ~450, porque os links longos chegavam partidos ao telemóvel.
   Se o relé não responder, mostra-se um erro claro em vez de "link inválido" — a causa é
   outra (rede/relé em baixo) e o cliente merece saber que o link está bom. */
function dec2(s){ try{ return JSON.parse(s); }catch(e){ return null; } }
function ecra(t,p){ document.getElementById('card').innerHTML='<h1>'+t+'</h1><p class="warn">'+p+'</p>'; }
/* AGENDA VIVA (links v:4, 15/11/2026). Pede ao relé a lista viva da zona do link e chama cb({b,d}),
   ou cb(null) se não vier nada que sirva: rede, `ok:false` (`sem agenda`, `notfound`...), resposta
   ilegível, ou sem resposta em 6 s. Com null quem chama desenha o b/d do payload. cb uma vez só: a
   resposta que chega depois do teto já não redesenha por cima. */
function agendaBoa(j){
  if(!(j&&j.ok===true&&typeof j.b==='string'&&/^\d{4}-\d\d-\d\d$/.test(j.b)&&Object.prototype.toString.call(j.d)==='[object Array]'))return false;
  for(var n=0;n<j.d.length;n++){var pr=j.d[n];
    if(Object.prototype.toString.call(pr)!=='[object Array]'||pr.length!==2||typeof pr[0]!=='number'||Object.prototype.toString.call(pr[1])!=='[object Array]')return false;
    for(var m=0;m<pr[1].length;m++)if(typeof pr[1][m]!=='number')return false;}
  return true;
}
/* `f` = ['yyyy-mm-dd'], `x` = {dia:[[a,b],...]} com números. Outra coisa = como se não viesse. */
function impBoa(f,x){
  var re=/^\d{4}-\d\d-\d\d$/, ARR='[object Array]';
  if(Object.prototype.toString.call(f)!==ARR)return false;
  for(var i=0;i<f.length;i++)if(typeof f[i]!=='string'||!re.test(f[i]))return false;
  if(!x||typeof x!=='object'||Object.prototype.toString.call(x)===ARR)return false;
  for(var k in x){if(!Object.prototype.hasOwnProperty.call(x,k))continue;
    if(!re.test(k)||Object.prototype.toString.call(x[k])!==ARR)return false;
    for(var n=0;n<x[k].length;n++){var p=x[k][n];if(Object.prototype.toString.call(p)!==ARR||p.length!==2||typeof p[0]!=='number'||typeof p[1]!=='number')return false;}}
  return true;
}
/* A HORA PREFERIDA DO CENTRO (18/11/2026). Um `v:4` de um centro com hora preferida traz `hp` =
   [início, fim) em minutos: da lista viva da zona ficam só as horas m com início <= m < fim, e o dia
   sem nenhuma sai. O relé novo já a manda cortada; cortar aqui também é o que vale enquanto o relé
   no ar for o antigo. Sem `hp`, ou ilegível, a lista fica como veio (links já enviados). */
function janelaHp(d,hp){
  if(Object.prototype.toString.call(hp)!=='[object Array]'||hp.length!==2)return d;
  var a=hp[0],f=hp[1];
  if(typeof a!=='number'||typeof f!=='number'||a%1!==0||f%1!==0||a<0||f>1440||a>=f)return d;
  var o=[];
  for(var n=0;n<d.length;n++){var hs=[];for(var m=0;m<d[n][1].length;m++){var v=d[n][1][m];if(v>=a&&v<f)hs.push(v);}
    if(hs.length)o.push([d[n][0],hs]);}
  return o;
}
function pedirAgenda(id,cb){
  var feito=false, tm=null;
  function fim(v){ if(feito)return; feito=true; clearTimeout(tm); cb(v); }
  tm=setTimeout(function(){ fim(null); },6000);
  try{
    fetch(DEFAULT_R+'?action=agenda&i='+encodeURIComponent(id))
      .then(function(r){ return r.json(); })
      .then(function(j){ if(!agendaBoa(j)){fim(null);return;} var v={b:j.b,d:j.d}; if(impBoa(j.f,j.x))v.imp={f:j.f,x:j.x}; fim(v); },function(){ fim(null); });
  }catch(e){ fim(null); }
}
/* SEM LIGAÇÃO ao abrir o link: o link está bom, por isso oferece-se "Tentar de novo" (corre o
   arranque outra vez). `_arr` conta os arranques: a resposta de um arranque anterior que chegue
   depois de um novo ter começado é ignorada. */
var _arr=0;
function semLigacao(){
  ecra('Sem ligação','Não consegui carregar as datas. Verifique a ligação e tente de novo, ou responda diretamente à mensagem.');
  document.getElementById('card').innerHTML+='<button class="btn" style="background:var(--green-d)" onclick="arranque()">Tentar de novo</button>';
}
function arranque(){
  var eu=++_arr;
  var i=''; try{ i=new URLSearchParams(location.search).get('i')||''; }catch(e){}
  if(!i){                                          // link ?q= de sempre
    var q=null; try{ q=dec(new URLSearchParams(location.search).get('q')); }catch(e){}
    /* O LONGO v:4 nao tem payload guardado no rele: o `action=agenda` responde `notfound`, mostra-se o b/d do envio e o clique nao leva a validacao do `ocupada`. */
    if(q&&q.v===4&&q.id){ ecra('Um momento…','A carregar as datas disponíveis.'); pedirAgenda(String(q.id),function(viva){ render(undefined,viva); }); return; }
    render(); return;
  }
  ecra('Um momento…','A carregar as datas disponíveis.');
  var to=setTimeout(function(){ if(eu===_arr)semLigacao(); },15000);
  fetch(DEFAULT_R+'?action=load&i='+encodeURIComponent(i))
    .then(function(r){ return r.json(); })
    .then(function(j){
      clearTimeout(to);
      if(eu!==_arr)return;
      var pj=(j&&j.ok&&j.p)?dec2(j.p):null;
      if(pj&&pj.v===4)pedirAgenda(i,function(viva){ render(j.p,viva); });
      else if(j&&j.ok&&j.p)render(j.p);
      else ecra('Link inválido','Este link já não é válido. Por favor responda diretamente à mensagem.');
    })
    .catch(function(){
      clearTimeout(to);
      if(eu===_arr)semLigacao();
    });
}
arranque();
</script>
