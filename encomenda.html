<!DOCTYPE html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Encomenda</title><style>*{box-sizing:border-box}body{margin:0;background:#F6F8FB;font-family:Arial,Helvetica,sans-serif;color:#39414D}.w{max-width:720px;margin:0 auto;padding:16px}h1{font-size:20px;color:#103F72;margin:4px 0 2px}.sub{font-size:13px;color:#6C7889;margin-bottom:14px}.falta{position:sticky;top:0;z-index:2;background:#fff;border:1px solid #DEE5EE;border-radius:12px;padding:12px 14px;margin-bottom:12px}.big{font-size:22px;font-weight:800;color:#D24A3D;text-align:center}.bar{height:8px;background:#EEF2F7;border-radius:6px;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:#D24A3D}.falta.mau{border-color:#D24A3D;background:#FBE9E7}.falta.ok{border-color:#6E9A1E;background:#F3F9E7}.ok .big{color:#557617}.ok .bar i{background:#6E9A1E}td.p.nao{color:#B23A2F;box-shadow:inset 4px 0 0 #D24A3D}td.p.sim{color:#557617;box-shadow:inset 4px 0 0 #6E9A1E}.modos{display:flex;flex-wrap:nowrap;align-items:center;justify-content:center;gap:8px;margin-bottom:10px}.modos:empty{display:none}.modos .ch{flex:none}.mx{font-size:13px;font-weight:600;color:#103F72;line-height:1.25}.nv{font-size:12px;color:#6C7889;margin-top:4px;text-align:center}table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #DEE5EE;border-radius:12px;overflow:hidden}td,th{padding:9px 8px;border-bottom:1px solid #EEF2F7;font-size:14px}td.q{text-align:center;white-space:nowrap}th{background:#175FAA;color:#fff;font-size:12px;font-weight:700;text-align:center;white-space:nowrap}th.p,td.p{text-align:left;white-space:normal;min-width:110px}th.p{text-align:center}th .dt{font-size:11px;font-weight:400;opacity:.85}th[id]{cursor:pointer}th.on{background:#103F72}td.on{background:#EEF4FB}span.v{display:inline-block;min-width:34px;padding:6px 0;cursor:pointer}.tw{overflow-x:auto;border-radius:12px}button.s{width:30px;height:32px;border-radius:10px;border:1px solid #DEE5EE;background:#fff;font-size:18px;color:#134F8E;cursor:pointer}input.n{width:40px;height:32px;padding:0;text-align:center;font-size:16px;border:1px solid #DEE5EE;border-radius:10px;margin:0 2px;-moz-appearance:textfield;appearance:textfield}input.n::-webkit-outer-spin-button,input.n::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}.tr{font-size:11px;color:#98A4B5}textarea{width:100%;min-height:60px;margin:12px 0;padding:8px;border:1px solid #DEE5EE;border-radius:10px;font:inherit;font-size:16px}.acts{display:flex;gap:10px;flex-wrap:wrap}.acts button{height:40px;padding:0 18px;border-radius:20px;font-weight:700;font-size:14px;cursor:pointer}#fin,#cfs{border:1.5px solid #6E9A1E;background:#F3F9E7;color:#557617}#fin:disabled,#cfs:disabled{opacity:.45;cursor:not-allowed}th .dt.ed{position:relative;display:inline-block;margin-top:3px;padding:3px 8px;border:1px solid #fff;border-radius:8px;opacity:1;font-weight:700;white-space:nowrap}th .dt.ed input.dd{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;border:0;padding:0;margin:0;font-size:16px;cursor:pointer}.cf{background:#fff;border:1.5px solid #6E9A1E;border-radius:12px;padding:14px;margin-bottom:12px}.cft{font-size:17px;font-weight:800;color:#103F72;margin-bottom:8px}.cfx{white-space:pre-wrap;font-size:14.5px;line-height:1.45;margin-bottom:10px}.cfn{font-size:13px;color:#B23A2F;font-weight:700;margin-bottom:12px}#cp2{height:36px;padding:0 16px;border-radius:20px;font-weight:700;font-size:13px;cursor:pointer;margin:8px 8px 0}.sec{border:1.5px solid #DEE5EE;background:#fff;color:#39414D}#msg{font-size:12px;color:#557617;margin-top:8px;min-height:15px}a.lk{margin:8px 8px 0;padding:9px 16px;border-radius:20px;border:1.5px solid #134F8E;color:#134F8E;font-size:13px;font-weight:700;text-decoration:none}.ex{background:#EEF4FB;border:1px solid #C9DBF0;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:14.5px;line-height:1.45;color:#103F72}.ex div+div{margin-top:4px}input.n.fx{border:2px solid #175FAA;background:#EEF4FB;font-weight:700;color:#103F72}@media (max-width:600px){.w{padding:12px 0}.w>h1,.w>.sub,.ex,.modos,.falta,textarea,.acts,#msg,.cf{margin-left:8px;margin-right:8px}.w textarea{width:calc(100% - 16px)}.tw,.tw table{border-radius:0}.tw table{border-left:0;border-right:0}td,th{padding:7px 2px;font-size:13px}th.p,td.p{min-width:0;padding-left:8px}button.s{width:24px;height:30px}input.n{width:32px;height:30px;margin:0 1px}span.v{min-width:22px}th{white-space:normal;line-height:1.2}th.p,td.p{width:100%}}.ch{height:34px;padding:0 10px;border-radius:17px;border:1.5px solid #DEE5EE;background:#fff;color:#39414D;font-weight:700;font-size:12px;cursor:pointer}.ch.on{background:#134F8E;border-color:#134F8E;color:#fff}</style></head><body><div class="w"><h1 id="nome"></h1><div class="sub" id="sub"></div><button id="tn" class="sec" style="display:none;margin:0 8px 12px" onclick="tentar()">Tentar de novo</button><div id="ed"><div class="ex" id="ex"></div><div id="modos" class="modos"></div><div id="fb" class="falta"><div id="big" class="big"></div><div class="bar"><i id="bi"></i></div><div id="nv" class="nv"></div></div><div class="tw"><table><thead id="th"></thead><tbody id="tb"></tbody></table></div><textarea id="obs" placeholder="Observações (opcional)"></textarea><div class="acts"><button id="fin" onclick="finalizar()">Finalizar e enviar por email</button><button class="sec" onclick="copiar()">Copiar</button><button class="sec" onclick="repor()">Repor</button></div></div><div id="cf" class="cf" style="display:none"><div class="cft">Confirme a encomenda e as datas</div><div id="cfx" class="cfx"></div><div class="cfn">Depois de confirmar já não dá para alterar.</div><div class="acts"><button id="cfs" onclick="confirmar()">Confirmar e enviar</button><button class="sec" onclick="voltar()">Voltar atrás</button></div></div><div id="msg"></div><a id="eml" class="lk" style="display:none"></a><button id="cp2" class="sec" style="display:none" onclick="copiar()">Copiar</button><textarea id="txt" readonly style="display:none;min-height:160px"></textarea></div><script>var __PAGINA__=function sugFichPagina(){
  var N=D.ent.length,K=0,doc=document;
  /* AS DATAS SAO DO CLIENTE DA 2.a ENTREGA EM DIANTE: `DT` = as datas no ecra (partem das do
     link). So num link `dm:1`; as regras sao as do `sugEncDataMotivo`, que e o MESMO codigo com
     que o PC volta a decidir. */
  var DT=D.ent.map(function(e){return {d:e.d,i:e.i};}),DM=D.dm===1&&N>1&&typeof sugEncDataMotivo==='function';
  var MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  function hojeL(){var x=new Date(),p=function(v){return (v<10?'0':'')+v;};return x.getFullYear()+'-'+p(x.getMonth()+1)+'-'+p(x.getDate());}
  /* O MODO E DO CLIENTE (Bruno, 16/10/2026): "Base + Novos" (o total e cada produto novo com o
     minimo dele) ou "Base" (um valor so, os novos la dentro). So aparece a escolha quando as duas
     dao contas diferentes; um link de antes (sem `alvoT`) fica no Base + Novos, como era. */
  /* AJUSTE AUTOMATICO, como na app: a linha que o cliente mexe fica FIXA e as outras livres da
     MESMA encomenda acertam-se pelo alocador do fecho (opcao A do Bruno, 16/10: so a encomenda
     escolhida; as outras colunas nao mexem). Um link de antes nao traz `bf` e fica sem ajuste. */
  var AUTO=D.bf!=null&&typeof sugFechoAlocar==='function',FX=[];
  var DUAS=D.alvoT!=null&&(D.novos.length>0||Math.abs(D.alvo-D.alvoT)>=0.005),MO=DUAS&&D.m==='total'?'total':'base',M0=MO;
  function mk(tag,cls,txt){var e=doc.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
  doc.title='Encomenda '+D.nome;
  doc.getElementById('nome').textContent=D.nome;
  /* link curto: o Finalizar manda ao rele, sem email -- ver o `confirmar` */
  if(window.__ENC)doc.getElementById('fin').textContent='Finalizar encomenda';
  doc.getElementById('sub').textContent='Proposta de encomenda Pharmadiet · '+String(D.data||'').split('-').reverse().join('/');
  var ex=doc.getElementById('ex');
  /* O TEXTO CURTO (Bruno, 16/10/2026: "tenta resumir mais o texto inicial"). A linha "Toque no
     titulo de uma encomenda para a mudar" saiu no mesmo dia, a pedido dele. */
  [AUTO?'Mude as unidades com − e +: as outras acertam-se sozinhas (as que mudou ficam a azul).':'Mude as unidades com − e +.',
   'Verde: pronto a enviar.',DM?'Toque na data de uma encomenda para a mudar (a 1.ª é na hora).':''].forEach(function(t){if(t)ex.appendChild(mk('div',null,t));});
  if(DUAS){var mo=doc.getElementById('modos');
    [['base','Base + Novos'],['total','Base']].forEach(function(o){var b=mk('button','ch',o[1]);b.id='m_'+o[0];b.onclick=function(){modo(o[0]);};mo.appendChild(b);});
    mo.appendChild(mk('div','mx',null)).id='mx';}
  /* A TABELA TEM A FORMA DA DO ECRA (Bruno, 24/09/2026): uma coluna por encomenda, com a data
     por baixo (o Total saiu a 25/09, a pedido). Os - e + so aparecem na encomenda escolhida (os botoes
     por cima ou o titulo da coluna); nas outras fica o numero, e tocar nele muda para ela --
     quatro colunas de - e + nao cabem num telemovel. */
  /* Os cartoes "1.a/2.a/3.a encomenda" sairam (Bruno, 16/10/2026): escolhe-se pelo titulo da coluna. */
  var th=doc.getElementById('th'),hr=mk('tr');hr.appendChild(mk('th','p','Produto'));
  D.ent.forEach(function(e,k){var h=mk('th',null,N>1?(k+1)+'ª encomenda':'Unidades');h.id='h'+k;
    var dt=mk('div','dt',e.d);dt.id='dt'+k;h.appendChild(dt);if(N>1)h.onclick=function(){escolhe(k);};
    /* a data toca-se: um campo de data transparente por cima do dd/mm abre o calendario do
       proprio telemovel, ja limitado ao mes dessa entrega e de hoje em diante */
    if(DM&&k>=1){var J=sugEncJanela(D.ent[0].i,k),hj=hojeL(),mn=J&&J.de>hj?J.de:hj;
      if(J&&mn<=J.ate){dt.className='dt ed';dt.textContent='';var ds=mk('span',null,e.d+' ✎');ds.id='ds'+k;dt.appendChild(ds);
        var di=mk('input','dd');di.type='date';di.id='di'+k;di.min=mn;di.max=J.ate;di.value=e.i;
        di.onchange=function(){data(k,this.value);};di.onclick=function(){try{this.showPicker();}catch(x){}};dt.appendChild(di);}}
    hr.appendChild(h);});
  th.appendChild(hr);
  var tb=doc.getElementById('tb');
  D.linhas.forEach(function(l,i){var tr=mk('tr'),a=mk('td','p',l.d);a.id='p'+i;
    if(l.t)a.appendChild(mk('div','tr','quantidade da campanha'));
    tr.appendChild(a);
    D.ent.forEach(function(e,k){var q=mk('td','q');q.id='c'+i+'_'+k;
      if(l.t){var b=mk('b');b.id='b'+i+'_'+k;q.appendChild(b);}
      else{var v=mk('span','v');v.id='v'+i+'_'+k;v.onclick=function(){escolhe(k);};
        var g=mk('span','g');g.id='g'+i+'_'+k;
        var m=mk('button','s','−');m.onclick=function(){mexe(i,-1);};
        var n=mk('input','n');n.id='q'+i+'_'+k;n.type='number';n.min='0';n.step='1';n.setAttribute('inputmode','numeric');n.oninput=function(){poe(i,this.value);};
        var p=mk('button','s','+');p.onclick=function(){mexe(i,1);};g.appendChild(m);g.appendChild(n);g.appendChild(p);q.appendChild(v);q.appendChild(g);}
      tr.appendChild(q);});
    tb.appendChild(tr);});
  /* As unidades de partida do modo `MO`: as do ecra (`u`) ou, no outro modo, as que a app
     proporia (`o`). Link sem `o` (de antes): sempre as `u`. */
  /* `B` = a proposta de partida (a do link, ou a do modo escolhido). O ajuste parte SEMPRE dela e
     nunca do ajuste anterior (CVLS, 16/10/2026: + e - no Dafortel, seis vezes, e o Lacristal ia de 2
     a 8 -- cada toque somava ao que o anterior deixara). Assim o resultado so depende das linhas
     mexidas e do valor delas: voltar ao numero de partida devolve a encomenda de partida. */
  var B;
  function copia(){FX=D.linhas.map(function(l){return l.u.map(function(){return false;});});
    var c=D.linhas.map(function(l){return (MO!==M0&&l.o?l.o:l.u).slice();});B=c.map(function(r){return r.slice();});return c;}
  var Q=copia();
  function tl(i){var s=0;for(var k=0;k<N;k++)s+=Q[i][k];return s;}
  function eur(x){return x.toLocaleString('pt-PT',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';}
  function soma(g){var s=0;D.linhas.forEach(function(l,i){if(g===undefined||l.g===g)s+=l.v*tl(i);});return s;}
  function alvo(){return MO==='total'?D.alvoT:D.alvo;}
  function estado(){var t=soma(),falta=Math.max(0,alvo()-t),ok=falta<0.005,nv=[],gr={};
    if(MO!=='total')D.novos.forEach(function(n){var fx=Math.max(0,n.f-soma(n.g));gr[n.g]=fx<0.005;if(fx>=0.005){ok=false;nv.push(n.g+': faltam '+eur(fx));}});
    return {t:t,falta:falta,ok:ok,nv:nv,gr:gr,modo:MO};}
  function pinta(){var e=estado();doc.getElementById('fb').className='falta'+(e.ok?' ok':' mau');
    if(DUAS){['base','total'].forEach(function(m){doc.getElementById('m_'+m).className='ch'+(m===MO?' on':'');});
      doc.getElementById('mx').textContent=MO==='total'?'Todos os produtos contam.':'Cada novo com o seu mínimo.';}
    /* Cada produto novo pinta-se pelo grupo dele: verde com o minimo cumprido, vermelho sem. No
       modo Base nao ha minimo por produto, e a linha fica sem cor. */
    D.linhas.forEach(function(l,i){var c=l.g&&(l.g in e.gr)?(e.gr[l.g]?' sim':' nao'):'';doc.getElementById('p'+i).className='p'+c;});
    doc.getElementById('big').textContent=e.ok?'Objetivo atingido ✓':(e.falta>=0.005?'Faltam '+eur(e.falta):'Faltam os produtos abaixo');
    doc.getElementById('bi').style.width=(alvo()>0?Math.min(100,e.t/alvo()*100):100)+'%';
    doc.getElementById('nv').textContent=e.nv.join(' · ');doc.getElementById('fin').disabled=!e.ok||ENVIANDO||ENVIADA;
    D.linhas.forEach(function(l,i){
      for(var k=0;k<N;k++){var on=k===K;doc.getElementById('c'+i+'_'+k).className='q'+(on&&N>1?' on':'');
        if(l.t){doc.getElementById('b'+i+'_'+k).textContent=Q[i][k];continue;}
        var el=doc.getElementById('q'+i+'_'+k);if(doc.activeElement!==el)el.value=Q[i][k];el.className='n'+(FX[i][k]?' fx':'');
        doc.getElementById('v'+i+'_'+k).textContent=Q[i][k];
        doc.getElementById('v'+i+'_'+k).style.display=on?'none':'';doc.getElementById('g'+i+'_'+k).style.display=on?'':'none';}});
    for(var k=0;k<N;k++){if(N>1)doc.getElementById('h'+k).className=k===K?'on':'';}
    guarda();}
  /* O AJUSTE FICA GUARDADO NESTE APARELHO (`localStorage`, uma chave por link): se o cliente
     fechar a pagina sem querer, ao voltar encontra as unidades, o modo, as datas e as observacoes
     como as deixou. So se retoma o que continua a ser valido para ESTE link (mesmas linhas e
     entregas, campanhas intactas, datas dentro das regras); o resto ignora-se e abre a proposta.
     Depois de enviada, apaga-se. Sem `localStorage` (anexo aberto de um email, modo privado)
     nao se guarda nada e a pagina funciona na mesma. */
  var CH='pharma_enc_'+((window.__ENC&&window.__ENC.id)||(D.nif+'_'+D.data));
  function guarda(){if(ENVIADA)return;try{localStorage.setItem(CH,JSON.stringify({q:Q,f:FX,m:MO,d:DT.map(function(x){return x.i;}),o:String(doc.getElementById('obs').value||'')}));}catch(e){}}
  function esquece(){try{localStorage.removeItem(CH);}catch(e){}}
  function retoma(){var s=null;try{s=JSON.parse(localStorage.getItem(CH)||'null');}catch(e){s=null;}
    if(!s||!Array.isArray(s.q)||s.q.length!==D.linhas.length)return;
    var m=s.m==='total'?'total':'base';if(!DUAS&&m!==MO)return;
    var mo0=MO;MO=m;var P=copia();
    var bom=s.q.every(function(r,i){return Array.isArray(r)&&r.length===N&&r.every(function(v,k){return typeof v==='number'&&v>=0&&v<100000&&v===Math.floor(v)&&(!D.linhas[i].t||v===P[i][k]);});});
    if(!bom){MO=mo0;Q=copia();return;}
    Q=s.q.map(function(r){return r.slice();});
    if(Array.isArray(s.f)&&s.f.length===Q.length)s.f.forEach(function(r,i){if(Array.isArray(r))for(var k=0;k<N;k++)FX[i][k]=r[k]===true&&!D.linhas[i].t;});
    if(DM&&Array.isArray(s.d)&&s.d.length===N)for(var k=1;k<N;k++){var v=String(s.d[k]||''),di=doc.getElementById('di'+k);
      if(di&&v!==DT[k].i&&sugEncDataMotivo(D,k,v,hojeL())===''){DT[k]={i:v,d:v.slice(8,10)+'/'+v.slice(5,7)};di.value=v;doc.getElementById('ds'+k).textContent=DT[k].d+' ✎';}}
    if(typeof s.o==='string')doc.getElementById('obs').value=s.o.slice(0,2000);}
  /* As bolsas sao as da app: no Base + Novos, cada produto novo com falta cobre-se com as linhas
     dele (mais a margem em unidades) e a base com as outras (mais a margem dela) -- bolsas separadas,
     como na app: Hepatosil a mais nao tira da base. No Base e uma bolsa so. O alvo da encomenda `k` e o da
     bolsa menos o que as OUTRAS encomendas ja levam. */
  /* `so` = a linha mexida: so se reajusta a bolsa DELA. As outras bolsas nao mudaram nada, e
     recalcula-las a partir do que esta no ecra dava 1 ou 2 unidades diferentes das da app. */
  function reajusta(k,so){if(!AUTO)return;
    function livre(i){var l=D.linhas[i];return !l.t&&!FX[i][k]&&!(l.f&&MO===M0)&&l.v>0;}
    function val(f,quais){var s=0;D.linhas.forEach(function(l,i){if(!f(l))return;for(var j=0;j<N;j++){if((quais==='k'&&j!==k)||(quais==='outras'&&j===k))continue;s+=l.v*Q[i][j];}});return s;}
    function fixoK(f){var s=0;D.linhas.forEach(function(l,i){if(f(l)&&!livre(i))s+=l.v*Q[i][k];});return s;}
    function aloca(lista,f,alvo){var a=alvo-val(f,'outras'),fx=fixoK(f);
      if(!(a>fx))lista.forEach(function(x){x.r.sug=0;});else sugFechoAcerta(lista,a,fx);
      lista.forEach(function(x){Q[x.i][k]=x.r.sug;});}
    function bolsa(f,alvo){var lista=[],igual=true;
      /* piso 1 = uma referencia que ele compra e que ja estava na proposta nao sai por inteiro */
      D.linhas.forEach(function(l,i){if(!f(l))return;if(livre(i))lista.push({i:i,net:l.v,piso:(B[i][k]>0&&l.a>0)?1:0,r:{sug:B[i][k],avg:l.a||0}});else if(Q[i][k]!==B[i][k])igual=false;});
      /* as linhas fixas todas como na partida = a encomenda de partida, sem acerto nenhum */
      if(igual)lista.forEach(function(x){Q[x.i][k]=x.r.sug;});else aloca(lista,f,alvo);lista.igual=igual;return lista;}
    var lm=so!=null?D.linhas[so]:null;
    if(MO==='total'){bolsa(function(){return true;},D.alvoT+sugFechoMargem(D.alvoT));return;}
    var NG={};D.novos.forEach(function(n){NG[n.g]=1;});
    D.novos.forEach(function(n){var f=function(l){return l.g===n.g;};if(lm&&!f(lm))return;
      var bl=bolsa(f,n.f),dentro=bl.filter(function(x){return x.r.sug>0;}),m=sugFechoMargemNovos(dentro);
      if(m>0&&!bl.igual)aloca(dentro,f,n.f+m);});
    var fb=function(l){return !NG[l.g];};if(!lm||fb(lm))bolsa(fb,D.bf+sugFechoMargem(D.alvo));
  }
  function escolhe(k){K=k;pinta();}
  /* Trocar de modo faz o que a app faz: volta a proposta desse modo e solta as linhas mexidas. */
  function modo(m){if(!DUAS||ENVIANDO||ENVIADA)return;MO=m==='total'?'total':'base';
    if(D.linhas.every(function(l){return !!l.o;}))Q=copia();else reajusta(K);pinta();}
  function mexe(i,d){if(D.linhas[i].t||ENVIANDO||ENVIADA)return;Q[i][K]=Math.max(0,(Q[i][K]|0)+d);FX[i][K]=true;reajusta(K,i);pinta();}
  function poe(i,v){if(D.linhas[i].t||ENVIANDO||ENVIADA)return;v=parseInt(v,10);Q[i][K]=isNaN(v)||v<0?0:v;FX[i][K]=true;reajusta(K,i);pinta();}
  function repor(){if(ENVIANDO||ENVIADA)return;Q=copia();DT=D.ent.map(function(e){return {d:e.d,i:e.i};});
