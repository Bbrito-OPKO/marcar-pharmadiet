    if(!esc)break;
    esc.r.sug++;v+=esc.net;
  }
  /* E TAMBEM TIRA (Bruno, 2026-09-18): acrescentar uma referencia que o cliente nao compra tem de
     sair de algum lado, senao a encomenda cresce por cima do objetivo -- e o objetivo e o que ele
     tem de comprar, nao um minimo a que se vai somando. Tira-se das linhas LIVRES, a maior que
     ainda cabe na sobra, e para-se antes de descer abaixo do alvo: o que ele escreveu a mao nao
     se toca, o resto e que se aperta. */
  while(v>alvo+1e-9&&guarda++<20000){
    const sobra=v-alvo;let esc=null;
    for(let i=0;i<lista.length;i++){const x=lista[i];if(x.r.sug>(x.piso||0)&&x.net<=sobra+1e-9&&(!esc||x.net>esc.net))esc=x;}
    if(!esc)break;
    esc.r.sug--;v-=esc.net;
  }
}
